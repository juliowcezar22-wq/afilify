name: testes
on:
  push: { branches: [main] }
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]   # 3.9 = Mac atual · 3.12 = imagem da VPS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Suíte (stdlib puro, sem pip install)
        run: python -m unittest discover -s tests -v
